{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl bg-white border rounded-lg p-6">
  <h1 class="text-xl font-semibold mb-2">Delete question?</h1>
  <p class="mb-4 text-slate-600">{{ question.text }}</p>
  <p class="text-xs text-slate-500 mb-4">If the question is used in an exam it will be deactivated instead.</p>
  <form method="post" class="flex gap-2">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a href="{% url 'question_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
